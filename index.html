<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fort Ancient Chatbot</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <div class="chat-container">

        <h1>Fort Ancient</h1>

        <p>
            Ask questions about Fort Ancient and related archaeological sites.
        </p>


        <div id="chat-box">

            <div class="bot-message">
                Hello! Ask me a question about Fort Ancient.
            </div>

        </div>


        <div class="input-container">

            <input
                type="text"
                id="question-input"
                placeholder="Ask a question..."
            >

            <button id="send-button">
                Send
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
